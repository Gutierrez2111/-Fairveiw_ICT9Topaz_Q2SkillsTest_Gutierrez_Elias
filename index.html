<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkilsTest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.hero{
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  padding: 35px 15px;
  overflow: hidden;
}

.background-container{
  position: absolute;
  inset: 0;
  z-index: -1;
  overflow: hidden;
}

#bg-image{
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.55;
  filter: blur(2px);
}

.heading{
  display: flex;
  align-items: center ;
  justify-content: center;
  gap: 25px;
  max-width: 850px;
  margin: 0 auto 30px auto;
  padding: 20px 35px;
  background-color: rgb(255, 255, 255, 0.80);
  border: 2px solid black;
  border-radius: 10 px;
  color: black;
  text-align: left;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
}

.heading img{
  width: 85px;
  height: 85px;
  object-fit: contain;
}

.page-content{
  background-color: white;
  border: 2px solid black;
  padding: 30px;
  border-radius: 10px;
  width: 100%;
  max-width: 1100px;
  margin:  0 auto 30px auto;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

.page-content h3{
  font-weight: bold;
  margin-bottom: 15px;
  margin-top: 20px;
}

.submit-button{
  background-color: blue;
  color: white;
  border: 2px solid blue;
  padding: 10px 25px;
  border-radius: 5px;
}

.navbar{
  border-bottom: 3px solid black;
}

.form-check-input[type="radio"]{
  border: 2px solid black
}

#confirm{
  border: 2px solid black;
}

footer{
  text-align: center;
  color: rgb(0, 0, 0);
  background-color: rgb(255, 255, 255);
  padding: 8px;
  font-size: 12px;
  border: 2px solid black;
}

</style>

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-warning bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><img src="https://play-lh.googleusercontent.com/OwiIxkQhT3F-zukYQJGQKTDaJrj0ub-gku-nn2vEOszKWHMLa87D060lRIVZxQYMzAjRpAHb4wM8Iix9Tn_gfA=w240-h480" alt="OBMClogo" class="rounded-circle school-logo" style="height: 60px; width: 60px;"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="javascript:void(0)">HOME</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://obmontessori.edu.ph/">ABOUT</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="javascript:void(0)">ENROLL</a>
        </li>
      </ul>
      <form class="d-flex">
        <button class="btn btn-warning text-light" type="button">My Portal</button>
    </div>
  </div>
</nav>

<main class="hero">

<div class="background-container">
    <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/9804865a-f6de-47d0-b463-c569491b9621/OBMC+MONTESSORI+FV+1+-+AY+2026+FA.jpg" id="bg-image">
</div>

<div class="heading">
  <img src="https://play-lh.googleusercontent.com/OwiIxkQhT3F-zukYQJGQKTDaJrj0ub-gku-nn2vEOszKWHMLa87D060lRIVZxQYMzAjRpAHb4wM8Iix9Tn_gfA=w240-h480" alt="OBMC Logo">

  <div>
        <h1>OBMC Student Enrollment Form</h1>
        <p>Fill out the form below to enroll</p>
    </div>

</div>

    <div class="row justify-content shadow" id="enrollment">
      
            <div class="page-content shadow">
                <form action="#" method="post">

                    <h2 class="h5 mb-3">Student Info</h2>
                    <hr>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="FirstName" class="form-label">First Name</label>

                    <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter First name" required>
                    </div>

               <div class="row">
                <div class="col-md-6 mb-3"></div>
                  <label for="FirstName" class="form-label">Last Name</label>

                  <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Enter Last Name" required>

              </div>
          </div>

              <div class="row">
                <div class="col-md-4 mb-3">
                  <label for="birthdate" class="form-label">Birh Date</label>

                  <input type="date" class="form-control" id="birthdate" name="Birth Date" required>
                </div>
              </div>

              <div class="col-md-4 mb-3">
                <label for="gender" class="form-label">Gender
                </label>
                
                <select class="form-select" id="gender" name="gender" required>
                  <option value="" selected disabled>Select<option>

                  <option>Male</option>
                  <option>Femake</option>
                  <option>Prefer not to say</option>

                  </select>
              </div>

              <div class="col-md-4 mb-3">
                <label for="grade" class="form-label">Grade Level</label>
                
                <select class="form-select" id="grade" name="grade" required>
                  <option value="" selected disabled>Select<option>

                  <option>Grade 7</option>
                  <option>Grade 8</option>
                  <option>Grade 9</option>
                  <option>Grade 10</option>
                  <option>Grade 11</option>
                  <option>Grade 12</option>

                  </select>
              </div>

            <hr>

            <h2 class="h5 mb-3">Contact Details</h2>
            <div class="mb-3">
              
              <label for="email" class="form-label">Email Address</label>

              <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
              
              <label for="contactNumber" class="form-label">Contact Number</label>

              <input type="tel" class="form-control" id="contactNumber" name="contactNumber" placeholder="0917-123-4567" required>
            </div>

            <hr>
      
<h2 class="h5 mb-3">Other Info</h2>

<label class="form-label">Mode of Learning</label>

<div class="mb-3">
    <div class="form-check">
        <input class="form-check-input" type="radio"
            name="learningmode" id="online" value="Online" required>

        <label class="form-check-label" for="online">Online</label>
    </div>

    <div class="form-check">
        <input class="form-check-input" type="radio"
            name="learningmode" id="f2f" value="Face-to-Face" required>

        <label class="form-check-label" for="f2f">Face-to-Face</label>
    </div>
</div>

<div class="form-check mt-4">
    <input class="form-check-input" type="checkbox" id="confirm" required>

    <label class="form-check-label" for="confirm">
        I confirm the provided info is true and complete.
    </label>
</div>

<div class="text-center mt-4">
    <button type="submit" class="btn btn-primary submit-button">
        Submit Enrollment
    </button>
</div>

</form>
</div>
            
</main>

    <footer id="contact">Elias Gutierrez, November 2026 || SKILLS TEST</footer>

</body>
</html>
